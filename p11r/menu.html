<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu — Kegiatan</title>
<link rel="stylesheet" href="style.css">
<script src="api-client.js"></script>
<script src="auth-guard.js"></script>
<style>
  .btn-logout {
    position: fixed;
    top: 18px;
    right: 18px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text-muted);
    font-family: inherit;
    font-size: 0.8rem;
    padding: 7px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, transform 0.1s ease;
  }

  .btn-logout:hover {
    background: var(--bg);
    color: var(--text);
  }

  .btn-logout:active {
    transform: scale(0.96);
  }

  .btn-logout svg {
    width: 14px;
    height: 14px;
  }

  .menu-page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 64px 24px;
  }

  .menu-header {
    text-align: center;
    margin-bottom: 40px;
  }

  .menu-header h1 {
    font-size: 1.3rem;
    font-weight: 600;
    margin: 0 0 4px;
  }

  .menu-header p {
    font-size: 0.88rem;
    color: var(--text-muted);
    margin: 0;
  }

  .menu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 160px));
    gap: 20px;
    max-width: 480px;
  }

  .menu-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
    padding: 8px;
    border-radius: var(--radius);
    transition: transform 0.12s ease;
  }

  .menu-card:hover {
    transform: translateY(-2px);
  }

  .menu-card:hover .menu-card-icon {
    border-color: var(--border-strong, #c7cad1);
    box-shadow: 0 6px 16px rgba(20, 20, 30, 0.08);
  }

  .menu-card-icon {
    width: 96px;
    height: 96px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: box-shadow 0.12s ease, border-color 0.12s ease;
  }

  .menu-card-icon svg {
    width: 52px;
    height: 52px;
  }

  .menu-card-label {
    font-size: 0.85rem;
    font-weight: 500;
    text-align: center;
    color: var(--text);
  }
</style>
</head>
<body>

  <button class="btn-logout" id="btn-logout" title="Keluar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
    Keluar
  </button>

  <div class="menu-page">
    <div class="menu-header">
      <h1>Kegiatan</h1>
      <p>Pilih menu untuk memulai</p>
    </div>

    <div class="menu-grid">

      <a class="menu-card" href="index.html">
        <div class="menu-card-icon">
          <!-- Kalender + jam: mewakili jadwal harian -->
          <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <clipPath id="calendarClip">
                <rect x="8" y="12" width="48" height="44" rx="8"/>
              </clipPath>
            </defs>
            <rect x="8" y="12" width="48" height="44" rx="8" fill="#2f6fed"/>
            <g clip-path="url(#calendarClip)">
              <rect x="8" y="12" width="48" height="14" fill="#1f4fb8"/>
            </g>
            <rect x="18" y="6" width="5" height="12" rx="2.5" fill="#1c1e21"/>
            <rect x="41" y="6" width="5" height="12" rx="2.5" fill="#1c1e21"/>
            <circle cx="40" cy="42" r="14" fill="#ffffff"/>
            <circle cx="40" cy="42" r="14" fill="#15803d" fill-opacity="0.12"/>
            <circle cx="40" cy="42" r="11.5" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/>
            <path d="M40 35v7l5 4" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <rect x="14" y="34" width="14" height="4" rx="2" fill="#e8f0fe"/>
            <rect x="14" y="42" width="10" height="4" rx="2" fill="#e8f0fe"/>
          </svg>
        </div>
        <span class="menu-card-label">Jadwal Harian</span>
      </a>

      <a class="menu-card" href="ringkasan.html">
        <div class="menu-card-icon">
          <!-- Batang statistik + kaca pembesar: mewakili ringkasan/laporan -->
          <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <rect x="8" y="8" width="48" height="48" rx="10" fill="#fef3c7"/>
            <rect x="14" y="38" width="8" height="12" rx="2" fill="#b45309"/>
            <rect x="26" y="30" width="8" height="20" rx="2" fill="#d97706"/>
            <rect x="38" y="22" width="8" height="28" rx="2" fill="#f59e0b"/>
            <circle cx="44" cy="20" r="11" fill="#ffffff" stroke="#15803d" stroke-width="3"/>
            <path d="M44 15v5l3.5 2.5" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
        </div>
        <span class="menu-card-label">Ringkasan Jadwal Harian</span>
      </a>

      <a class="menu-card" href="cetak-barcode.html">
        <div class="menu-card-icon">
          <!-- Kartu label + garis barcode: mewakili cetak label/barcode gudang -->
          <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <rect x="6" y="16" width="52" height="32" rx="6" fill="#ffffff" stroke="#c00000" stroke-width="2.5"/>
            <rect x="6" y="16" width="18" height="32" rx="6" fill="#c00000"/>
            <rect x="18" y="16" width="6" height="32" fill="#c00000"/>
            <rect x="30" y="23" width="22" height="4" rx="1.5" fill="#1c1e21"/>
            <rect x="30" y="30" width="14" height="4" rx="1.5" fill="#9aa0aa"/>
            <g fill="#1c1e21">
              <rect x="30" y="38" width="1.6" height="8"/>
              <rect x="33" y="38" width="1" height="8"/>
              <rect x="35.5" y="38" width="2.2" height="8"/>
              <rect x="39" y="38" width="1" height="8"/>
              <rect x="41" y="38" width="1.6" height="8"/>
              <rect x="44" y="38" width="2.2" height="8"/>
              <rect x="47.5" y="38" width="1" height="8"/>
              <rect x="49.5" y="38" width="1.6" height="8"/>
            </g>
          </svg>
        </div>
        <span class="menu-card-label">Cetak Barcode</span>
      </a>

      <a class="menu-card" href="musik.html">
        <div class="menu-card-icon">
          <!-- Not musik + gelombang suara: mewakili pemutar musik latar -->
          <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <rect x="6" y="6" width="52" height="52" rx="12" fill="#f3e8ff"/>
            <path d="M24 40V20l22-4v20" stroke="#7c3aed" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <circle cx="20" cy="42" r="6" fill="#7c3aed"/>
            <circle cx="42" cy="38" r="6" fill="#7c3aed"/>
          </svg>
        </div>
        <span class="menu-card-label">Musik</span>
      </a>

    </div>
  </div>

  <script>
    document.getElementById("btn-logout").addEventListener("click", function () {
      fetch("/api/auth?action=logout", { method: "POST", credentials: "same-origin" })
        .finally(function () { window.location.href = "login.html"; });
    });
  </script>

  <link rel="stylesheet" href="musik-player.css">
  <script src="musik-player.js"></script>
</body>
</html>
