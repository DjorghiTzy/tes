<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ringkasan Jadwal Harian</title>
<link rel="stylesheet" href="style.css">
<script src="api-client.js"></script>
<script src="auth-guard.js"></script>
<style>
  .ringkasan-page {
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 24px 64px;
  }

  .ringkasan-topbar {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 24px;
  }

  .ringkasan-topbar h1 {
    font-size: 1.15rem;
    font-weight: 600;
    margin: 0;
  }

  .stat-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 28px;
  }

  .stat-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
  }

  .stat-card-label {
    font-size: 0.76rem;
    color: var(--text-muted);
    margin: 0 0 4px;
  }

  .stat-card-value {
    font-size: 1.4rem;
    font-weight: 600;
    margin: 0;
  }

  /* ---------- Panel KPI (grafik 7 hari terakhir) — dipindah dari halaman Log ---------- */

  .kpi-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 20px;
  }

  .kpi-panel-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
    flex-wrap: wrap;
    gap: 6px;
  }

  .kpi-panel-title {
    font-size: 0.95rem;
    font-weight: 600;
    margin: 0;
  }

  .kpi-panel-sub {
    font-size: 0.78rem;
    color: var(--text-muted);
  }

  .kpi-panel-avg {
    font-size: 0.82rem;
    color: var(--text-muted);
  }

  .kpi-panel-empty {
    color: var(--text-muted);
    font-size: 0.85rem;
    padding: 12px 0 4px;
  }

  .kpi-chart {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    height: 110px;
    margin-top: 16px;
    position: relative;
  }

  .kpi-avg-line {
    position: absolute;
    left: 0;
    right: 0;
    border-top: 1px dashed var(--text-muted);
    opacity: 0.5;
  }

  .kpi-bar-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
    justify-content: flex-end;
    gap: 6px;
    position: relative;
  }

  .kpi-bar-value {
    font-size: 0.72rem;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .kpi-bar {
    width: 100%;
    max-width: 34px;
    border-radius: 5px 5px 0 0;
    background: var(--accent-soft);
    min-height: 3px;
  }

  .kpi-bar.today {
    background: var(--accent);
  }

  .kpi-bar.above-avg {
    background: var(--ok-soft);
  }

  .kpi-bar.today.above-avg {
    background: var(--ok);
  }

  .kpi-bar-label {
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .kpi-bar-col.no-data .kpi-bar {
    background: var(--bg);
    border: 1px dashed var(--border);
  }

  /* ---------- Chip ringkasan hari ini — dipindah dari halaman Log ---------- */

  .day-summary {
    display: flex;
    gap: 10px;
    margin: 0 0 28px;
    flex-wrap: wrap;
  }

  .summary-chip {
    flex: 1;
    min-width: 110px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 10px 14px;
    border-radius: var(--radius);
    background: var(--panel);
    border: 1px solid var(--border);
  }

  .summary-chip-label {
    font-size: 0.74rem;
    color: var(--text-muted);
  }

  .summary-chip-value {
    font-size: 1.05rem;
    font-weight: 600;
  }

  .summary-chip.warn {
    background: var(--warn-soft);
    border-color: var(--warn-soft);
  }

  .summary-chip.warn .summary-chip-value {
    color: var(--warn);
  }

  .summary-chip.ok .summary-chip-value {
    color: var(--ok);
  }

  .ringkasan-section-title {
    font-size: 0.95rem;
    font-weight: 600;
    margin: 0 0 12px;
  }

  .month-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .month-row {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .month-row-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    cursor: pointer;
  }

  .month-row-head:hover {
    background: var(--bg);
  }

  .month-row.empty .month-row-head {
    cursor: default;
  }

  .month-row.empty .month-row-head:hover {
    background: none;
  }

  .month-chevron {
    flex: none;
    width: 16px;
    height: 16px;
    color: var(--text-muted);
    transition: transform 0.12s ease;
  }

  .month-row.open .month-chevron {
    transform: rotate(90deg);
  }

  .month-row.empty .month-chevron {
    visibility: hidden;
  }

  .month-name {
    flex: 1;
    font-size: 0.95rem;
    font-weight: 500;
  }

  .month-row.empty .month-name {
    color: var(--text-muted);
    font-weight: 400;
  }

  .month-meta {
    display: flex;
    gap: 16px;
    font-size: 0.78rem;
    color: var(--text-muted);
  }

  .month-meta strong {
    color: var(--text);
    font-weight: 600;
  }

  .week-list {
    display: none;
    border-top: 1px solid var(--border);
    padding: 6px 16px 10px 44px;
  }

  .month-row.open .week-list {
    display: block;
  }

  .week-item {
    padding: 0;
    font-size: 0.85rem;
  }

  .week-item + .week-item {
    border-top: 1px solid var(--border);
  }

  .week-item-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 0;
    cursor: pointer;
  }

  .week-item.empty .week-item-head {
    cursor: default;
  }

  .week-chevron {
    flex: none;
    width: 13px;
    height: 13px;
    color: var(--text-muted);
    transition: transform 0.12s ease;
  }

  .week-item.open .week-chevron {
    transform: rotate(90deg);
  }

  .week-item.empty .week-chevron {
    visibility: hidden;
  }

  .week-item-label {
    color: var(--text);
    flex: 1;
  }

  .week-item-meta {
    display: flex;
    gap: 14px;
    font-size: 0.78rem;
    color: var(--text-muted);
  }

  .day-list {
    display: none;
    padding: 2px 0 10px 21px;
  }

  .week-item.open .day-list {
    display: block;
  }

  .day-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 7px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.82rem;
    color: var(--text);
    text-decoration: none;
    transition: background 0.12s ease;
  }

  .day-item:hover {
    background: var(--bg);
  }

  .day-item:hover .day-item-label {
    color: var(--accent, var(--text));
  }

  .day-item-label {
    display: flex;
    align-items: baseline;
    gap: 6px;
    min-width: 0;
  }

  .day-item-name {
    font-weight: 500;
  }

  .day-item-date {
    color: var(--text-muted);
    font-size: 0.76rem;
    white-space: nowrap;
  }

  .day-item-meta {
    display: flex;
    gap: 12px;
    font-size: 0.76rem;
    color: var(--text-muted);
    white-space: nowrap;
    flex: none;
  }

  .day-item-arrow {
    flex: none;
    width: 13px;
    height: 13px;
    color: var(--text-muted);
  }

  .empty-state {
    text-align: center;
    padding: 48px 16px;
    color: var(--text-muted);
    font-size: 0.9rem;
  }
</style>
</head>
<body>

  <div class="ringkasan-page">
    <div class="ringkasan-topbar">
      <a class="back-to-menu" href="menu.html" title="Kembali ke menu utama" style="padding:0;">&#8592; Menu</a>
      <h1>Ringkasan Jadwal Harian</h1>
    </div>

    <div class="kpi-panel" id="kpi-panel">
      <!-- Grafik 7 hari terakhir diisi oleh JS -->
    </div>

    <div class="day-summary" id="day-summary">
      <!-- Ringkasan hari terbaru diisi oleh JS -->
    </div>

    <p class="ringkasan-section-title">Ringkasan Keseluruhan</p>

    <div class="stat-row" id="stat-row">
      <!-- diisi oleh JS -->
    </div>

    <div class="month-list" id="month-list">
      <!-- diisi oleh JS -->
    </div>
  </div>

  <script>
    const STORAGE_KEY = "log-kegiatan-data";
    const NAMA_HARI = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
    const NAMA_BULAN = [
      "Januari", "Februari", "Maret", "April", "Mei", "Juni",
      "Juli", "Agustus", "September", "Oktober", "November", "Desember"
    ];
    const APP_YEAR = 2026;

    function loadScheduleDataLocal() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch (err) { return {}; }
    }

    async function loadScheduleData() {
      const localData = loadScheduleDataLocal();
      const result = await window.KegiatanAPI.getData("schedule", localData);
      const data = result.offline ? localData : (result.data || {});
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (_) {}
      if (!result.offline && !result.exists && Object.keys(localData).length > 0) {
        await window.KegiatanAPI.saveData("schedule", localData);
      }
      return data;
    }

    function todayISO() {
      return dateToISO(new Date());
    }

    function dateToISO(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function isoToDate(iso) {
      const [y, m, d] = iso.split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    function formatDayName(iso) {
      return NAMA_HARI[isoToDate(iso).getDay()];
    }

    function formatFullDate(iso) {
      const date = isoToDate(iso);
      return `${date.getDate()} ${NAMA_BULAN[date.getMonth()]} ${date.getFullYear()}`;
    }

    function weekOfMonthNumber(date) {
      return Math.ceil(date.getDate() / 7);
    }

    function timeToMinutes(value) {
      if (!value || !value.includes(":")) return 0;
      const [h, m] = value.split(":").map(Number);
      return (h || 0) * 60 + (m || 0);
    }

    function durationMinutes(activity) {
      const start = timeToMinutes(activity.jamMulai);
      const end = timeToMinutes(activity.jamSelesai);
      return Math.max(0, end - start);
    }

    function formatMinutesAsHours(totalMinutes) {
      if (totalMinutes <= 0) return "0 jam";
      const h = Math.floor(totalMinutes / 60);
      const m = totalMinutes % 60;
      if (h === 0) return `${m} menit`;
      if (m === 0) return `${h} jam`;
      return `${h} jam ${m} menit`;
    }

    // Versi ringkas dari formatMinutesAsHours, khusus label kecil di atas bar grafik.
    function shortHourLabel(totalMinutes) {
      if (totalMinutes <= 0) return "0j";
      const hours = totalMinutes / 60;
      return `${hours % 1 === 0 ? hours : hours.toFixed(1)}j`;
    }

    function getLast7Days(latestIso) {
      const result = [];
      const cursor = isoToDate(latestIso);

      for (let i = 6; i >= 0; i--) {
        const d = new Date(cursor);
        d.setDate(d.getDate() - i);
        result.push(dateToISO(d));
      }

      return result;
    }

    // Mengembalikan Set berisi index (dari array asli) yang bentrok
    // dengan kegiatan lain pada hari yang sama.
    function findConflicts(activities) {
      const conflicting = new Set();

      for (let i = 0; i < activities.length; i++) {
        for (let j = i + 1; j < activities.length; j++) {
          const aStart = timeToMinutes(activities[i].jamMulai);
          const aEnd = timeToMinutes(activities[i].jamSelesai);
          const bStart = timeToMinutes(activities[j].jamMulai);
          const bEnd = timeToMinutes(activities[j].jamSelesai);

          const overlap = aStart < bEnd && bStart < aEnd;
          if (overlap) {
            conflicting.add(i);
            conflicting.add(j);
          }
        }
      }

      return conflicting;
    }

    // Tanggal acuan untuk panel "7 Hari Terakhir" & chip ringkasan:
    // tanggal terbaru yang sudah punya data, kalau belum ada sama sekali pakai hari ini.
    function pickReferenceDate(scheduleData) {
      const dates = Object.keys(scheduleData).sort((a, b) => (a < b ? 1 : -1));
      return dates.length > 0 ? dates[0] : todayISO();
    }

    // Meringkas satu kumpulan hari (ISO -> array kegiatan) menjadi statistik:
    // jumlah hari, total menit, kegiatan selesai, kegiatan total.
    function summarize(scheduleData, isoList) {
      let totalMinutes = 0;
      let doneCount = 0;
      let activityCount = 0;

      isoList.forEach(iso => {
        const activities = scheduleData[iso] || [];
        activities.forEach(activity => {
          totalMinutes += durationMinutes(activity);
          activityCount += 1;
          if (activity.selesai) doneCount += 1;
        });
      });

      return {
        dayCount: isoList.length,
        totalMinutes,
        activityCount,
        doneCount
      };
    }

    let scheduleData = {};

    function render() {
      const allDates = Object.keys(scheduleData);
      const referenceDate = pickReferenceDate(scheduleData);

      renderKpiPanel(scheduleData, referenceDate);
      renderDaySummary(scheduleData, referenceDate);
      renderTopStats(scheduleData, allDates);
      renderMonthList(scheduleData, allDates);
    }

    // ---------- Panel KPI: grafik total jam per hari, 7 hari terakhir ----------
    // Dipindahkan dari halaman Log. "7 hari terakhir" dihitung mundur dari
    // referenceDate (tanggal terbaru yang punya data, atau hari ini kalau kosong).

    function renderKpiPanel(scheduleData, referenceDate) {
      const panel = document.getElementById("kpi-panel");
      panel.innerHTML = "";

      const last7 = getLast7Days(referenceDate);

      const dayTotals = last7.map(iso => {
        const activities = scheduleData[iso] || [];
        const hasData = Object.prototype.hasOwnProperty.call(scheduleData, iso);
        const totalMinutes = activities.reduce((sum, a) => sum + durationMinutes(a), 0);
        return { iso, totalMinutes, hasData };
      });

      const daysWithData = dayTotals.filter(d => d.hasData);
      const avgMinutes =
        daysWithData.length > 0
          ? Math.round(daysWithData.reduce((sum, d) => sum + d.totalMinutes, 0) / daysWithData.length)
          : 0;

      const maxMinutes = Math.max(...dayTotals.map(d => d.totalMinutes), 60); // minimal skala 1 jam biar tidak gepeng

      const header = document.createElement("div");
      header.className = "kpi-panel-header";

      const titleWrap = document.createElement("div");
      const title = document.createElement("h3");
      title.className = "kpi-panel-title";
      title.textContent = "Aktivitas 7 Hari Terakhir";
      titleWrap.appendChild(title);

      if (daysWithData.length > 0) {
        const sub = document.createElement("div");
        sub.className = "kpi-panel-sub";
        sub.textContent = `Sampai ${formatFullDate(referenceDate)}`;
        titleWrap.appendChild(sub);
      }

      const avgLabel = document.createElement("span");
      avgLabel.className = "kpi-panel-avg";
      avgLabel.textContent = avgMinutes > 0 ? `Rata-rata: ${formatMinutesAsHours(avgMinutes)}/hari` : "";

      header.appendChild(titleWrap);
      header.appendChild(avgLabel);
      panel.appendChild(header);

      const chart = document.createElement("div");
      chart.className = "kpi-chart";

      if (avgMinutes > 0) {
        const avgLine = document.createElement("div");
        avgLine.className = "kpi-avg-line";
        const avgPositionFromBottom = (avgMinutes / maxMinutes) * 100;
        avgLine.style.bottom = `${avgPositionFromBottom}%`;
        chart.appendChild(avgLine);
      }

      dayTotals.forEach(day => {
        chart.appendChild(buildKpiBar(day, maxMinutes, avgMinutes, referenceDate));
      });

      panel.appendChild(chart);
    }

    function buildKpiBar(day, maxMinutes, avgMinutes, referenceIso) {
      const col = document.createElement("div");
      col.className = "kpi-bar-col" + (!day.hasData ? " no-data" : "");

      const valueLabel = document.createElement("div");
      valueLabel.className = "kpi-bar-value";
      valueLabel.textContent = day.hasData ? shortHourLabel(day.totalMinutes) : "–";

      const bar = document.createElement("div");
      const heightPercent = day.hasData ? Math.max((day.totalMinutes / maxMinutes) * 100, 2) : 2;
      bar.style.height = `${heightPercent}%`;

      let barClass = "kpi-bar";
      if (day.iso === referenceIso) barClass += " today";
      if (day.hasData && avgMinutes > 0 && day.totalMinutes > avgMinutes) barClass += " above-avg";
      bar.className = barClass;

      const label = document.createElement("div");
      label.className = "kpi-bar-label";
      label.textContent = formatDayName(day.iso).slice(0, 3);

      col.appendChild(valueLabel);
      col.appendChild(bar);
      col.appendChild(label);
      return col;
    }

    // ---------- Chip ringkasan hari terbaru — dipindah dari halaman Log ----------

    function renderDaySummary(scheduleData, referenceDate) {
      const container = document.getElementById("day-summary");
      container.innerHTML = "";

      const activities = scheduleData[referenceDate] || [];
      const totalMinutes = activities.reduce((sum, a) => sum + durationMinutes(a), 0);
      const conflicts = findConflicts(activities);

      container.appendChild(buildSummaryChip("Kegiatan", `${activities.length}`, ""));
      container.appendChild(buildSummaryChip("Total Jam Terisi", formatMinutesAsHours(totalMinutes), totalMinutes > 0 ? "ok" : ""));
      container.appendChild(
        buildSummaryChip("Bentrok Jadwal", conflicts.size > 0 ? `${conflicts.size} kegiatan` : "Tidak ada", conflicts.size > 0 ? "warn" : "ok")
      );
    }

    function buildSummaryChip(label, value, tone) {
      const chip = document.createElement("div");
      chip.className = "summary-chip" + (tone ? ` ${tone}` : "");

      const labelEl = document.createElement("div");
      labelEl.className = "summary-chip-label";
      labelEl.textContent = label;

      const valueEl = document.createElement("div");
      valueEl.className = "summary-chip-value";
      valueEl.textContent = value;

      chip.appendChild(labelEl);
      chip.appendChild(valueEl);
      return chip;
    }

    function renderTopStats(scheduleData, allDates) {
      const statRow = document.getElementById("stat-row");
      const overall = summarize(scheduleData, allDates);
      const avgMinutesPerDay = overall.dayCount > 0 ? Math.round(overall.totalMinutes / overall.dayCount) : 0;

      statRow.innerHTML = "";
      statRow.appendChild(buildStatCard("Total hari tercatat", `${overall.dayCount} hari`));
      statRow.appendChild(buildStatCard("Total jam kegiatan", formatMinutesAsHours(overall.totalMinutes)));
      statRow.appendChild(buildStatCard("Rata-rata per hari", formatMinutesAsHours(avgMinutesPerDay)));
    }

    function buildStatCard(label, value) {
      const card = document.createElement("div");
      card.className = "stat-card";

      const labelEl = document.createElement("p");
      labelEl.className = "stat-card-label";
      labelEl.textContent = label;

      const valueEl = document.createElement("p");
      valueEl.className = "stat-card-value";
      valueEl.textContent = value;

      card.appendChild(labelEl);
      card.appendChild(valueEl);
      return card;
    }

    function renderMonthList(scheduleData, allDates) {
      const monthList = document.getElementById("month-list");
      monthList.innerHTML = "";

      if (allDates.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "Belum ada data jadwal untuk diringkas.";
        monthList.appendChild(empty);
        return;
      }

      // Kelompokkan tanggal per bulan (khusus APP_YEAR, selaras dengan app.js utama)
      // dan per minggu dalam bulan itu.
      const byMonth = {}; // { month: { week: [iso, ...] } }
      allDates.forEach(iso => {
        const date = isoToDate(iso);
        if (date.getFullYear() !== APP_YEAR) return;
        const month = date.getMonth();
        const week = weekOfMonthNumber(date);
        if (!byMonth[month]) byMonth[month] = {};
        if (!byMonth[month][week]) byMonth[month][week] = [];
        byMonth[month][week].push(iso);
      });

      for (let month = 0; month < 12; month++) {
        const weeksObj = byMonth[month] || {};
        const monthIsos = Object.values(weeksObj).flat();
        monthList.appendChild(buildMonthRow(scheduleData, month, weeksObj, monthIsos));
      }
    }

    function buildMonthRow(scheduleData, month, weeksObj, monthIsos) {
      const isEmpty = monthIsos.length === 0;
      const summary = summarize(scheduleData, monthIsos);

      const row = document.createElement("div");
      row.className = "month-row" + (isEmpty ? " empty" : "");

      const head = document.createElement("div");
      head.className = "month-row-head";

      const chevron = document.createElement("div");
      chevron.className = "month-chevron";
      chevron.innerHTML = '<svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

      const name = document.createElement("div");
      name.className = "month-name";
      name.textContent = NAMA_BULAN[month];

      const meta = document.createElement("div");
      meta.className = "month-meta";

      if (isEmpty) {
        meta.innerHTML = "<span>Belum ada data</span>";
      } else {
        meta.innerHTML =
          "<span><strong>" + summary.dayCount + "</strong> hari</span>" +
          "<span><strong>" + formatMinutesAsHours(summary.totalMinutes) + "</strong></span>" +
          "<span><strong>" + summary.doneCount + "/" + summary.activityCount + "</strong> selesai</span>";
      }

      head.appendChild(chevron);
      head.appendChild(name);
      head.appendChild(meta);
      row.appendChild(head);

      if (!isEmpty) {
        const weekList = document.createElement("div");
        weekList.className = "week-list";

        const weekNumbers = Object.keys(weeksObj).map(Number).sort((a, b) => a - b);
        weekNumbers.forEach(week => {
          const weekIsos = weeksObj[week];
          weekList.appendChild(buildWeekItem(scheduleData, week, weekIsos));
        });

        row.appendChild(weekList);

        head.addEventListener("click", () => {
          row.classList.toggle("open");
        });
      }

      return row;
    }

    // ---------- Baris "Minggu N" yang bisa di-expand untuk menampilkan hari-harinya ----------
    // Klik pada baris minggu -> buka/tutup daftar hari.
    // Klik pada salah satu hari -> pindah ke halaman Log pada tanggal itu.

    function buildWeekItem(scheduleData, week, weekIsos) {
      const weekSummary = summarize(scheduleData, weekIsos);

      const item = document.createElement("div");
      item.className = "week-item";

      const head = document.createElement("div");
      head.className = "week-item-head";

      const chevron = document.createElement("div");
      chevron.className = "week-chevron";
      chevron.innerHTML = '<svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

      const label = document.createElement("div");
      label.className = "week-item-label";
      label.textContent = "Minggu " + week;

      const meta = document.createElement("div");
      meta.className = "week-item-meta";
      meta.innerHTML =
        "<span>" + weekSummary.dayCount + " hari</span>" +
        "<span>" + formatMinutesAsHours(weekSummary.totalMinutes) + "</span>" +
        "<span>" + weekSummary.doneCount + "/" + weekSummary.activityCount + " selesai</span>";

      head.appendChild(chevron);
      head.appendChild(label);
      head.appendChild(meta);
      item.appendChild(head);

      const dayList = document.createElement("div");
      dayList.className = "day-list";

      const sortedWeekIsos = [...weekIsos].sort((a, b) => (a < b ? -1 : 1));
      sortedWeekIsos.forEach(iso => {
        dayList.appendChild(buildDayItem(scheduleData, iso));
      });

      item.appendChild(dayList);

      head.addEventListener("click", (e) => {
        e.stopPropagation(); // jangan ikut toggle baris bulan di atasnya
        item.classList.toggle("open");
      });

      return item;
    }

    // Satu baris hari di dalam daftar minggu: klik -> pindah ke halaman Log
    // pada tanggal tersebut (index.html?date=YYYY-MM-DD).
    function buildDayItem(scheduleData, iso) {
      const activities = scheduleData[iso] || [];
      const totalMinutes = activities.reduce((sum, a) => sum + durationMinutes(a), 0);
      const doneCount = activities.filter(a => a.selesai).length;

      const link = document.createElement("a");
      link.className = "day-item";
      link.href = "index.html?date=" + encodeURIComponent(iso);
      link.title = "Buka " + formatFullDate(iso) + " di Jadwal Harian";

      const labelWrap = document.createElement("div");
      labelWrap.className = "day-item-label";

      const name = document.createElement("span");
      name.className = "day-item-name";
      name.textContent = formatDayName(iso);

      const dateEl = document.createElement("span");
      dateEl.className = "day-item-date";
      dateEl.textContent = formatFullDate(iso);

      labelWrap.appendChild(name);
      labelWrap.appendChild(dateEl);

      const meta = document.createElement("div");
      meta.className = "day-item-meta";
      meta.innerHTML =
        "<span>" + activities.length + " kegiatan</span>" +
        "<span>" + formatMinutesAsHours(totalMinutes) + "</span>" +
        "<span>" + doneCount + "/" + activities.length + " selesai</span>";

      const arrow = document.createElement("span");
      arrow.className = "day-item-arrow";
      arrow.innerHTML = '<svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

      link.appendChild(labelWrap);
      link.appendChild(meta);
      link.appendChild(arrow);

      return link;
    }

    loadScheduleData().then(function (data) {
      scheduleData = data;
      render();
    }).catch(function (error) {
      console.error(error);
      render();
    });
  </script>

  <link rel="stylesheet" href="musik-player.css">
  <script src="musik-player.js"></script>
</body>
